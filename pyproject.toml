[project]
name = "ten-capital-investor-matching-engine"
version = "1.0.0"
description = "TEN Capital Investor Matching Engine - pitch deck to ranked investor matches and a one-page report."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "streamlit>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pymupdf.*",
    "ignore::DeprecationWarning:reportlab.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
